<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Conecta Carreiras - oportunidades acadêmicas e profissionais em tecnologia.">
  <title>Contato | Conecta Carreiras</title>
  <link rel="stylesheet" href="css/estilo.css">
</head>
<body>

<header>
  <div class="container navbar">
    <a class="logo" href="index.html">Conecta<span>Carreiras</span></a>
    <nav aria-label="Navegação principal">
      <ul>
        <li><a href="index.html" >Início</a></li>
        <li><a href="oportunidades.html" >Oportunidades</a></li>
        <li><a href="sobre.html" >Sobre</a></li>
        <li><a href="contato.html" aria-current='page'>Contato</a></li>
      </ul>
    </nav>
  </div>
</header>

<main>

<section>
  <div class="container">
    <h1 class="section-title">Entre em contato</h1>
    <p>Preencha o formulário abaixo. Nesta atividade, o formulário é apenas demonstrativo e não envia dados para um servidor.</p>
    <form class="formulario" action="#" method="post">
      <div class="form-grid">
        <div class="campo">
          <label for="nome">Nome completo</label>
          <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        </div>
        <div class="campo">
          <label for="email">E-mail</label>
          <input type="email" id="email" name="email" placeholder="voce@exemplo.com" required>
        </div>
        <div class="campo">
          <label for="telefone">Telefone</label>
          <input type="tel" id="telefone" name="telefone" placeholder="(11) 99999-9999" required>
        </div>
        <div class="campo">
          <label for="assunto">Assunto</label>
          <select id="assunto" name="assunto" required>
            <option value="">Selecione uma opção</option>
            <option value="estagio">Estágio</option>
            <option value="curso">Curso</option>
            <option value="evento">Evento</option>
            <option value="outro">Outro</option>
          </select>
        </div>
        <div class="campo campo-full">
          <label for="mensagem">Mensagem</label>
          <textarea id="mensagem" name="mensagem" placeholder="Escreva sua mensagem" required></textarea>
        </div>
        <div class="campo campo-full">
          <label class="checkbox" for="aceite">
            <input type="checkbox" id="aceite" name="aceite" required>
            <span>Concordo em fornecer os dados para contato neste formulário demonstrativo.</span>
          </label>
        </div>
      </div>
      <button class="btn" type="submit">Enviar mensagem</button>
    </form>
  </div>
</section>

</main>

<footer>
  <div class="container footer-flex">
    <div><strong>Conecta Carreiras</strong><br>Portal acadêmico de oportunidades para tecnologia.</div>
    <div><a href="https://www.linkedin.com/" target="_blank" rel="noopener noreferrer">LinkedIn</a></div>
  </div>
</footer>

</body>
</html>
